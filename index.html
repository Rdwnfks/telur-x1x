<main id="app"></main>
<div id="nota"><div class="card"><pre id="np"></pre><div class="row2"><button onclick="print()">Cetak</button><button onclick="share()">Bagikan</button><button onclick="$('nota').style.display='none'" style="background:var(--bg);color:var(--t)">Tutup</button></div></div></div>

<script>
const Z='Asia/Jakarta',$=i=>document.getElementById(i),AK={telur:'Kas Telur',warung:'Kas Warung',pribadi:'Kas Pribadi'};

async function init(){
 try{const u=window.claude&&await claude.use('user'),d=window.claude&&await claude.use('db');
  if(u&&d){const c=d.collection('data/users/'+await u.id()+'/tx');store={set:r=>c.doc(r.id).set(r),cloud:1};c.onSnapshot(s=>{rows=s.docs.map(x=>x.data());render()},()=>{});render();return}}catch(e){}
 try{rows=JSON.parse(localStorage.getItem('tx')||'[]')}catch(e){}
 store={set:r=>{const i=rows.findIndex(x=>x.id==r.id);i<0?rows.push(r):rows[i]=r;try{localStorage.setItem('tx',JSON.stringify(rows))}catch(e){}render();return Promise.resolve()}};render()}
function M(f){const a=live().filter(r=>f(dk(r.ts))),s=a.filter(r=>r.type=='sale'),z=a.filter(r=>r.type=='rusak');
 const kot=s.reduce((x,r)=>x+r.pcs*r.jual,0),po=s.reduce((x,r)=>x+r.pot,0),jual=kot-po,mo=s.reduce((x,r)=>x+r.pcs*r.modal,0),ex=-sum(a.filter(r=>r.type=='exp'&&r.acct=='telur')),rs=z.reduce((x,r)=>x+r.pcs*r.modal,0),rp=z.reduce((x,r)=>x+r.pcs,0),pc=s.reduce((x,r)=>x+r.pcs,0),u=jual-mo-ex-rs;
 return{a,s,z,kot,po,jual,mo,ex,rs,rp,pc,u,rr:pc+rp?Math.round(rp/(pc+rp)*100):0,mg:jual?Math.round(u/jual*100):0,tw:-sum(a.filter(r=>r.type=='tf'&&r.acct=='telur'&&r.to=='warung'))}}

const stk=()=>live().filter(r=>r.type=='stok').reduce((x,r)=>x+(r.pcs||0),0)-live().filter(r=>r.type=='sale'||r.type=='rusak').reduce((x,r)=>x+r.pcs,0);
const rsn=z=>{const o={};z.forEach(r=>o[r.alasan||'Lainnya']=(o[r.alasan||'Lainnya']||0)+r.pcs);return Object.entries(o).map(([k,v])=>k+' '+v).join(' · ')||'tidak ada'};

function view(){
 if(page=='h'){const t=dk(Date.now()),d=M(x=>x==t),c=mm(NOW);
  return `<div class="hero ${cl(d.u)}"><small>${tg(Date.now())}</small><div class="big">${R(d.u)}</div><small>Untung hari ini</small></div>

  <div class="grid g3"><div class="card"><small>Telur terjual</small><b>${d.pc}</b></div><div class="card"><small>Penjualan</small><b>${K(d.jual)}</b></div><div class="card"><small>Telur rusak</small><b class="${d.rp?'rd':''}">${d.rp}</b></div></div>
  <h2>Uang yang ada sekarang</h2><div class="grid" style="margin:0"><div class="card"><small>🥚 Kas Telur</small><div class="big">${R(bal('telur'))}</div></div><div class="card"><small>🏪 Kas Warung</small><div class="big">${R(bal('warung'))}</div></div>${live().some(r=>r.type=='stok'&&r.pcs)?`<div class="card" style="grid-column:1/-1"><small>📦 Perkiraan stok telur</small><div class="big">${stk().toLocaleString('id-ID')} pcs</div></div>`:''}</div>

 if(page=='c')return form();
 const c=mm(ym),p=mm(shift(ym,-1)),ds={},bs={};c.s.forEach(r=>{ds[dk(r.ts)]=(ds[dk(r.ts)]||0)+r.total;if(r.buyer)bs[r.buyer]=(bs[r.buyer]||0)+r.pcs});
 const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0],bd=top(ds),bb=top(bs),pct=p.u?Math.round((c.u-p.u)/Math.abs(p.u)*100):null,yr=ym.slice(0,4),Y=M(d=>d.slice(0,4)==yr),mn=MN[+ym.slice(5)-1];
 const ms=[-5,-4,-3,-2,-1,0].map(n=>shift(ym,n)),v=ms.map(y=>{const x=mm(y);return met=='u'?x.u:met=='j'?x.jual:met=='p'?x.pc:x.rp}),mx=Math.max(1,...v.map(Math.abs));
 const tb=[...Array(12)].map((_,i)=>yr+'-'+String(i+1).padStart(2,'0')).map(y=>[y,mm(y)]).filter(([y,x])=>x.a.length);
 return `<div class="mn"><button onclick="ym=shift(ym,-1);df='';render()">‹</button><input type="month" value="${ym}" max="${NOW}" onchange="if(this.value){ym=this.value;df='';render()}"><button onclick="ym=shift(ym,1);df='';render()" ${ym>=NOW?'disabled style="opacity:.3"':''}>›</button></div>
 <div class="hero ${cl(c.u)}"><small>${SC(c)} bulan ${mn}</small><div class="big">${R(c.u)}</div><small>${pct===null?'Belum ada pembanding bulan lalu':(pct>=0?'▲ naik ':'▼ turun ')+Math.abs(pct)+'% dari '+MN[+shift(ym,-1).slice(5)-1]} · margin ${c.mg}%</small></div>
 <div class="card" style="margin-top:10px"><small>🎯 Target untung bulanan</small>${TG()?pb(c.u,TG()):'<small>Belum diatur</small>'}<button onclick="setT()" style="margin-top:8px;padding:10px;background:var(--bg);color:var(--t);border:1px solid var(--b)">Atur target</button></div>
 <h2>🥚 Telur ${mn}</h2><div class="grid" style="margin:0"><div class="card"><small>Terjual</small><div class="big">${c.pc.toLocaleString('id-ID')}</div><small>pcs</small></div><div class="card"><small>Rusak / pecah / buruk</small><div class="big ${c.rp?'rd':''}">${c.rp.toLocaleString('id-ID')}</div><small>${c.rr}% dari total</small></div></div>
 <div class="card" style="margin-top:10px"><small>💔 Rincian rusak</small><b style="font-size:15px">${rsn(c.z)}</b><small>Kerugian ${R(c.rs)}</small></div>
 <h2>🧮 Laporan untung rugi</h2><div class="card">${l2('Penjualan kotor',R(c.kot))}${l2('Potongan harga','-'+R(c.po))}${l2('Modal telur terjual','-'+R(c.mo))}${l2('Telur rusak','-'+R(c.rs))}${l2('Pengeluaran lain','-'+R(c.ex))}${l2('Untung bersih',R(c.u),'t')}</div>

 <div class="card"><small>Untung per telur</small><b>${c.pc?R(Math.round(c.u/c.pc)):'-'}</b></div><div class="card"><small>Dikirim ke warung</small><b>${R(c.tw)}</b></div><div class="card" style="grid-column:1/-1"><small>Untung sepanjang ${yr}</small><b class="${Y.u<0?'rd':'g'}">${R(Y.u)}</b></div></div>
 <h2>📈 Perkembangan</h2><div class="chips">${[['u','Untung'],['j','Penjualan'],['p','Terjual'],['r','Rusak']].map(([k,l])=>`<button class="${met==k?'on':''}" onclick="met='${k}';render()">${l}</button>`).join('')}</div>
 <div class="card"><div class="chart">${ms.map((y,i)=>`<div>${met=='p'||met=='r'?v[i]:K(v[i])}<i class="${y==ym?'cur':''} ${v[i]<0||met=='r'?'neg':''}" style="height:${Math.round(Math.abs(v[i])/mx*100)}px"></i>${MN[+y.slice(5)-1].slice(0,3)}</div>`).join('')}</div></div>
 <h2>📋 Rekap tahun ${yr}</h2><div class="card" style="padding:6px 10px"><table><tr><th>Bulan</th><th>Jual</th><th>Untung</th><th>Telur</th><th>Rusak</th></tr>${tb.map(([y,x])=>`<tr onclick="ym='${y}';df='';render();scrollTo(0,0)"><td>${MN[+y.slice(5)-1].slice(0,3)}</td><td>${K(x.jual)}</td><td class="${x.u<0?'rd':'g'}">${K(x.u)}</td><td>${x.pc}</td><td>${x.rp}</td></tr>`).join('')||'<tr><td colspan=5 class="empty">Belum ada data</td></tr>'}<tr class="tot"><td>Total</td><td>${K(Y.jual)}</td><td class="${Y.u<0?'rd':'g'}">${K(Y.u)}</td><td>${Y.pc}</td><td>${Y.rp}</td></tr></table></div>
 <h2>Catatan ${mn}</h2><div class="two"><input type="date" value="${df}" onchange="df=this.value;if(df)ym=df.slice(0,7);render()"><button onclick="df='';render()" style="background:var(--c);color:var(--t);border:1px solid var(--b)">Semua tanggal</button></div><div style="height:10px"></div>${lst(c.a.filter(r=>!df||dk(r.ts)==df))}<h2>Data & aplikasi</h2><div class="two"><button onclick="bk()" style="background:var(--c);color:var(--t);border:1px solid var(--b)">💾 Backup</button><button onclick="pulih()" style="background:var(--c);color:var(--t);border:1px solid var(--b)">📥 Pulihkan</button></div>${ip?'<button onclick="inst()" style="margin-top:10px">📲 Pasang aplikasi di layar utama</button>':''}<p><small>Data tersimpan di perangkat ini. Lakukan Backup rutin, terutama sebelum ganti HP atau membersihkan browser.</small></p>`}
const T=[['sale','🥚','Jual Telur'],['rusak','💔','Telur Rusak'],['exp','🧾','Uang Keluar'],['tf','🏪','Ke Warung'],['modal','💰','Uang Masuk']];

function form(){

 else{h+=nf('am','Berapa uangnya?',fmt(A));
